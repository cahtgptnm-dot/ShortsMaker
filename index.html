
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShortsMaker</title>
</head>
<body>
  <h1>🎬 ShortsMaker</h1>
  <p>Turn a video into a vertical clip up to 60 seconds long.</p>

  <label for="video">Choose a video</label>
  <input id="video" type="file" accept="video/*">

  <p>
    <button <button id="start" onclick="document.getElementById('status').textContent='Button works!'">Create Short</button>>Create Short</button>
  </p>

  <p id="status">Choose a video to begin.</p>
  <a id="output" hidden>Download your vertical video</a>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
